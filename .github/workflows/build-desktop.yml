name: Build Desktop App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install Dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Web App
        working-directory: desktop
        run: npm run build

      - name: Package Windows Installer
        working-directory: desktop
        run: npx electron-builder --win nsis

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Sahayog-HR-Windows-Setup-EXE
          path: desktop/release/*.exe

      - name: Publish installer to the latest GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "latest"
          gh release create $tag --target $env:GITHUB_SHA --title "Sahayog HR — Latest build" --notes "Latest downloadable Windows and Android builds."
          if ($LASTEXITCODE -ne 0) { Write-Host "The latest release already exists." }
          $installer = Get-ChildItem "desktop/release/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not found." }
          gh release upload $tag "$($installer.FullName)#Sahayog-HR-Windows-Setup.exe" --clobber

