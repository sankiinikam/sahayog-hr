name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Ensure gradlew is Unix format and executable
        run: |
          sed -i 's/\r$//' desktop/android/gradlew
          chmod +x desktop/android/gradlew

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Web App
        working-directory: desktop
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p desktop/android/app/src/main/assets/public
          cp -r desktop/dist/* desktop/android/app/src/main/assets/public/

      - name: Build Android Debug APK
        working-directory: desktop/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahayog-HR-Debug-APK
          path: desktop/android/app/build/outputs/apk/debug/app-debug.apk
