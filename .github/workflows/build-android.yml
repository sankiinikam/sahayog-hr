name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Ensure gradlew is Unix format and executable
        run: |
          sed -i 's/\r$//' desktop/android/gradlew
          chmod +x desktop/android/gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Web App
        working-directory: desktop
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p desktop/android/app/src/main/assets/public
          cp -r desktop/dist/* desktop/android/app/src/main/assets/public/

      - name: Build Android Debug APK
        working-directory: desktop/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle.log 2>&1 || {
            cat gradle.log | tail -n 80
            exit 1
          }

      - name: Save Log to Branch on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-logs
          cp desktop/android/gradle.log ./latest-gradle-failure.txt
          git add latest-gradle-failure.txt
          git commit -m "chore: save latest gradle failure log"
          git push origin debug-logs -f

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahayog-HR-Debug-APK
          path: desktop/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
