appId: com.sahayog.hr
productName: Sahayog HR
copyright: Copyright © 2026 Sahayog HR Inc.
directories:
  output: release
files:
  - "dist/**/*"
  - "electron/**/*"
  - "package.json"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
